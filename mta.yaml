_schema-version: 3.3.0
ID: timesheet
description: A simple CAP project.
version: 1.0.0
parameters:
  appname: timesheet
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

# Modules
modules:
  - name: timesheet-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: timesheet-auth
      - name: timesheet-db
      - name: timesheet-connectivity
      - name: timesheet-destination-service
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci


  - name: timesheet-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: timesheet-db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm root
      ignore:
        - .env
        - ./node_modules


  - name: timesheet-destination-content
    type: com.sap.application.content
    requires:
      - name: timesheet-destination-service
        parameters:
          content-target: true
      - name: timesheet_html_repo_host
        parameters:
          service-key:
            name: timesheet_html_repo_host-key
      - name: timesheet-auth
        parameters:
          service-key:
            name: timesheet-auth-key
    parameters:
      content:
        subaccount:
          destinations:
            - Name: timesheet_timesheet_html_repo_host
              ServiceInstanceName: timesheet-html5-app-host-service
              ServiceKeyName: timesheet_html_repo_host-key
              sap.cloud.service: timesheet
            - Authentication: OAuth2UserTokenExchange
              Name: timesheet_timesheet_auth
              ServiceInstanceName: timesheet-auth
              ServiceKeyName: timesheet-auth-key
              sap.cloud.service: timesheet
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  
  - name: timesheet-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: timesheet_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - myapp.zip
          name: myapp
          target-path: resources/


  - name: myapp
    type: html5
    path: app/myapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []

# Resources       
resources:
  - name: timesheet-auth
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application


  - name: timesheet-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared


  - name: timesheet-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              # - Authentication: NoAuthentication
              #   HTML5.DynamicDestination: true
              #   HTML5.ForwardAuthToken: true
              #   HTML5.Timeout: 300000
              #   Name: timesheet-api
              #   ProxyType: Internet
              #   Type: HTTP
              #   URL: https://${appname}.${default-domain}
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: timesheet-destination-service
      service-plan: lite


  - name: timesheet_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: timesheet-html5-app-host-service
      service-plan: app-host


  - name: timesheet-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
